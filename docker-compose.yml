services:
  face-auth:
    build: .
    ports:
      - "8080:8080"
    environment:
      FACE_API_KEY: ${FACE_API_KEY:-change-me}
      FACE_DATABASE_URL: sqlite:////data/face_auth.db
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-90}
    volumes:
      - face-data:/data
    restart: unless-stopped
volumes:
  face-data:
